# Serval — quickstart stack. Three services: the Server (which bundles the web App — once it's
# up, http://<this-host>:8080/ is the App itself, same origin as the API), MongoDB, and a go2rtc
# sidecar for the low-latency WebRTC live view.
#
# Get running:
#
#   1. cp .env.example .env
#   2. Fill in the two required secrets in .env (each has its command written next to it).
#   3. docker compose up -d
#   4. Open http://<this-host>:8080/ and sign in with the admin account from .env.
#
# Recording, replay, the snapshot wall and live view all work from here with no model files and
# no extra hardware. The AI features (object detection, scene descriptions, transcription) are
# opt-in below — see "Server-side AI".
#
# Host-specific tuning examples live in examples/: a TrueNAS SCALE + AMD iGPU deployment and an
# Intel N100 + Coral Edge TPU deployment, both real and both commented for their hardware.

services:
  server:
    # The image name lives in .env so it is set in exactly one place. To build from source
    # instead of pulling, uncomment `build:` below and run `docker compose up -d --build` from
    # this directory (the context is the repo root, so this needs a full clone).
    image: ${SERVAL_IMAGE:-ghcr.io/flickersoft/serval-server:latest}
    # build:
    #   context: ..
    #   dockerfile: Server/Serval.Server/Dockerfile
    depends_on:
      - mongo
      - go2rtc
    ports:
      - "8080:8080"
    environment:
      Serval__Mongo__ConnectionString: mongodb://mongo:27017
      Serval__Mongo__Database: serval
      Serval__Media__Root: /media

      # Both are required, and compose stops with the message below if either is missing from
      # .env — on purpose, so a copied file cannot quietly become a deployment with secrets the
      # whole internet has. The server refuses to boot on placeholder values as a second line of
      # defence.
      Serval__Auth__SigningKey: ${SERVAL_SIGNING_KEY:?missing — generate with `openssl rand -base64 32` and put it in .env}
      Serval__Auth__BootstrapAdminUsername: ${SERVAL_ADMIN_USERNAME:-admin}
      # First run only: creates this Admin while the Users collection is empty, ignored on every
      # later restart. Change the password from the app once signed in, not here.
      Serval__Auth__BootstrapAdminPassword: ${SERVAL_ADMIN_PASSWORD:?missing — set the first admin's password in .env}

      # Shared secret for POST /api/cameras/{id}/telemetry, only used by an edge CameraModule.
      # Unset, that one route rejects every request and nothing else is affected.
      # Serval__ApiKey: ${SERVAL_API_KEY}

      # Retention is by age only, with no size cap — this number and the disk behind /media are
      # chosen together. As an anchor: six cameras recording 4K main streams is roughly
      # 300-400 GB a day.
      Serval__Media__RetentionDays: ${SERVAL_RETENTION_DAYS:-7}

      # Low-latency WebRTC live view via the go2rtc sidecar below.
      Serval__WebRtc__Enabled: "true"
      Serval__WebRtc__Go2RtcUrl: http://go2rtc:1984

      # --- Cameras in Google Home (optional, off by default) -------------------------------
      # The only feature here that needs this server reachable INBOUND from the internet, over
      # HTTPS with a real certificate, and it also needs a Nest Hub on the same LAN as go2rtc.
      # Google will not send a camera to a television by voice, whoever the vendor is; the app's
      # own Cast button is what does that. Read Docs/google-home.md before turning it on.
      #
      # Wired rather than commented out, unlike the optional blocks below: every one of these
      # defaults to empty, empty keeps the integration closed, and setting them in .env is then
      # the whole of turning it on. The client id and secret are values you generate, not values
      # Google gives you.
      Serval__GoogleHome__Enabled: ${SERVAL_GOOGLE_ENABLED:-false}
      Serval__GoogleHome__PublicBaseUrl: ${SERVAL_GOOGLE_PUBLIC_BASE_URL:-}
      Serval__GoogleHome__ProjectId: ${SERVAL_GOOGLE_PROJECT_ID:-}
      Serval__GoogleHome__ClientId: ${SERVAL_GOOGLE_CLIENT_ID:-}
      Serval__GoogleHome__ClientSecret: ${SERVAL_GOOGLE_CLIENT_SECRET:-}
      # Optional, and the one file Google does give you. Without it the integration works and
      # Google simply does not hear about a camera you added or renamed until you re-link.
      # Uncomment the ./secrets mount below to use it.
      Serval__GoogleHome__HomeGraphKeyPath: ${SERVAL_GOOGLE_HOMEGRAPH_KEY:-}
      # Optional. Empty leaves the Home app's per-camera switch out of the device list entirely,
      # which is the safe default — with a PIN set, switching a camera off asks for it.
      Serval__GoogleHome__VerificationPin: ${SERVAL_GOOGLE_VERIFICATION_PIN:-}
      # Optional, and what puts cameras on a television at all — the Cast button in the app.
      # Names the Cast application you registered against this server's own receiver page. Live
      # then plays over WebRTC straight from go2rtc; a recording is transcoded as it plays.
      # Empty is a working deployment with no Cast button. See Docs/google-home.md.
      Serval__GoogleHome__CastReceiverAppId: ${SERVAL_GOOGLE_CAST_RECEIVER_APP_ID:-}
      # The tallest a cast *recording* is transcoded to. 1080p because that is what the path can
      # actually deliver: a 2160p segment is 9.4 MB and takes 1.25s to encode, which needs 27 Mbit/s
      # sustained through your public address to keep up, and does not. Live casting is unaffected —
      # it is WebRTC and never transcoded.
      Serval__GoogleHome__CastMaxHeight: ${SERVAL_GOOGLE_CAST_MAX_HEIGHT:-1080}

      # --- Hardware video encode (optional) ------------------------------------------------
      # Nothing is re-encoded unless a camera's record stream asks for it, so this sits idle on
      # a stack that only records. To use the GPU (VAAPI, Intel or AMD) when a stream does ask,
      # uncomment this and the `devices:` block below. Confirm the render node with
      # `ls -l /dev/dri` on the host.
      # Serval__Ingest__HwAccelDevice: /dev/dri/renderD128

      # --- Server-side AI (optional, off by default) ---------------------------------------
      # A server that only records should not load weights it never uses, so everything here is
      # opt-in. Model files are NOT in the image — put them in ./models first (see the README's
      # "Enabling the AI"), then uncomment and `docker compose up -d --force-recreate server`.
      # Raise mem_limit below to 8g+ when enabling the vision model, and pin
      # Serval__Ai__Asr__Language where the site has one language — SenseVoice's "auto" misreads
      # short utterances.
      #
      # ServerAi is the master switch; each model has its own switch behind it. Setting only an
      # inner switch starts a server that logs nothing about AI at all, which is a confusing five
      # minutes.
      # Serval__ServerAi__Enabled: "true"
      # Serval__Ai__Detection__Enabled: "true"     # objects (person, car, ...) — needs models/detect/model.onnx + labels.txt
      # Serval__Ai__Vision__Enabled: "true"        # scene descriptions + clip summaries — needs the Qwen3-VL weights (~2.3 GB)
      # Serval__Ai__Speaker__Enabled: "true"       # transcription speaker labels + diarization
      # Serval__Ai__Sound__Enabled: "true"         # sound events: breaking glass, alarms, dogs, ...
      # Serval__Ai__Asr__Language: "en"
    volumes:
      # Recordings, snapshots, live manifests — the big writer. A named volume by default; to
      # keep recordings on a specific disk, replace it with a bind mount:
      #   - /path/on/big/disk:/media
      - video:/media
      # Model weights, mounted read-only from ./models (empty until you enable the AI — an empty
      # directory costs nothing, the server just notes the models are absent and keeps recording).
      - ./models:/app/models:ro
      # The Google Home HomeGraph service-account key, if you have one. Read-only: nothing here
      # should ever write a credential back. See Docs/google-home.md.
      # - ./secrets:/app/secrets:ro
    # Raw frames on their way to object detection: written by ffmpeg, read and deleted
    # immediately. Memory rather than disk on purpose — a busy host pushes tens of MB a second
    # through here and none of it is worth writing to the device holding the recordings.
    tmpfs:
      - /dev/shm/serval:size=256m
    # Give the container the GPU, for VAAPI encode and/or Vulkan offload of the vision model.
    # NVENC needs the NVIDIA container runtime instead. Software encode needs neither.
    # devices:
    #   - /dev/dri:/dev/dri
    # GPU utilisation on the status page. amdgpu needs nothing beyond the device above; Intel
    # reports usage through system-wide perf counters, which need this capability to open.
    # Without it the page reads "not reported" and names this line.
    # cap_add:
    #   - PERFMON
    # Enough for recording. With the vision model enabled, 8g+ (see examples/ for measured
    # working sets on real hosts).
    mem_limit: 2g
    restart: unless-stopped
    # Logs are stdout only — no file sink in the app, because the daemon already rotates.
    # Without a cap they grow forever on the same disk the video lives on. 10m x 5 = 50 MB.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mongo:
    image: mongo:8
    command: ["--wiredTigerCacheSizeGB", "1"]  # cap the cache so it doesn't grab host RAM
    volumes:
      # The database is small and wants IOPS where recordings want capacity — on a multi-disk
      # host, bind-mount this to the fast disk rather than the big one:
      #   - /path/on/fast/disk:/data/db
      - mongo-data:/data/db
    mem_limit: 2g
    restart: unless-stopped
    logging: *logging

  # WebRTC media server for the low-latency focused live view. The Server registers a stream per
  # camera at runtime, so none are configured statically — go2rtc pulls a camera's RTSP only
  # while a viewer is connected and adds no constant load. WebRTC media flows directly
  # browser <-> go2rtc (the 8666 port), never through the Server.
  #
  # Pinned rather than :latest — this is the one service where an unattended upgrade could break
  # live view without any code having changed.
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    # The second -config merges over the file and carries the one value that is per-host: the
    # address(es) the browser is told to send WebRTC media to. Set SERVAL_WEBRTC_CANDIDATES in
    # .env — comma-separated for more than one (LAN + external) — and never edit go2rtc.yaml.
    # The stun default auto-discovers the public address, which is enough to try things out but
    # wrong for LAN-only use; see .env.example.
    command:
      - go2rtc
      - -config
      - /config/go2rtc.yaml
      - -config
      - "{webrtc: {candidates: [${SERVAL_WEBRTC_CANDIDATES:-stun:8666}]}}"
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "8666:8666/tcp"     # WebRTC media (also served over UDP)
      - "8666:8666/udp"
      # The API (1984) is reached only by the Server over the internal network — not published.
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  # --- one-shot setup helpers -------------------------------------------------------------
  # Behind the "setup" profile so `docker compose up` never starts them; run each on demand.
  #
  # Downloads every model except the object detector into ./models (~3.5 GB, or set
  # SKIP_VISION=1 to skip the 2.3 GB scene-description model):
  #
  #   docker compose --profile setup run --rm fetch-models
  fetch-models:
    profiles: ["setup"]
    image: ${SERVAL_IMAGE:-ghcr.io/flickersoft/serval-server:latest}
    entrypoint: ["bash", "/app/fetch-models.sh"]
    environment:
      MODEL_DIR: /models
      # Who owns the weights once this finishes. Empty is the normal case: the script copies the
      # ownership of ./models, which a clone created as yours. Set them in .env only where
      # ./models was created by Docker rather than by a clone, and so is root-owned with no
      # ownership worth copying.
      MODEL_UID: ${MODEL_UID:-}
      MODEL_GID: ${MODEL_GID:-}
      SKIP_VISION: ${SKIP_VISION:-0}
      SKIP_SPEAKER: ${SKIP_SPEAKER:-0}
      SKIP_SOUND: ${SKIP_SOUND:-0}
      SKIP_DETECTION: ${SKIP_DETECTION:-0}
    volumes:
      - ./models:/models

  # Exports the object-detection model Serval is tested against (Ultralytics YOLO26n, stock
  # COCO-80) into ./models/detect as model.onnx + labels.txt:
  #
  #   docker compose --profile setup run --rm export-detector
  #
  # labels.txt is written from the model's own class names, so the two cannot disagree — a
  # mismatched labels file names every detection wrongly forever, with no error anywhere.
  # dynamic=True lets each camera get an input shape at its own aspect ratio (a portrait
  # doorbell, an ultrawide) instead of squeezing everything into one landscape rectangle.
  # Ultralytics and the YOLO26n weights are AGPL-3.0, the same license as Serval.
  export-detector:
    profiles: ["setup"]
    image: ultralytics/ultralytics:8.4.20
    environment:
      # The models root rather than detect/: the script makes and enters detect/ itself, and
      # reads the root to learn the ownership it hands the export back to. MODEL_UID/MODEL_GID
      # as in fetch-models above.
      MODEL_DIR: /models
      MODEL_UID: ${MODEL_UID:-}
      MODEL_GID: ${MODEL_GID:-}
    volumes:
      - ./models:/models
    entrypoint: ["python", "-c"]
    # The same script as scripts/export-detector.sh, which runs this export from a checkout. A
    # copy rather than a reference, because this one-shot has to work from a compose file and an
    # .env with no checkout at all — so the two have to stay identical.
    command:
      - |
        import os

        # MODEL_DIR is the models root, not detect/ — the ownership this export is handed back to
        # lives on the root directory, and abspath is taken before the chdir below so a relative
        # MODEL_DIR from a checkout still resolves afterwards.
        models = os.path.abspath(os.environ.get("MODEL_DIR", "/models"))
        detect = os.path.join(models, "detect")
        os.makedirs(detect, exist_ok=True)
        os.chdir(detect)


        def hand_back():
            # Root wrote everything here, into a bind mount of a directory belonging to whoever
            # ran this, so it is handed back to the ownership of the models root itself — which
            # is what a clone already carries — or to MODEL_UID/MODEL_GID where there was no
            # clone and Docker created that directory as root. In a finally block because a
            # failed export still leaves the downloaded weights behind, and those have to be as
            # deletable as a finished run. Skipped when not root, which is this same script run
            # against a local ultralytics install by its owner. A refusal is a warning rather
            # than a failure: the export itself succeeded.
            if os.geteuid() != 0:
                return
            st = os.stat(models)
            uid = int(os.environ.get("MODEL_UID") or st.st_uid)
            gid = int(os.environ.get("MODEL_GID") or st.st_gid)
            try:
                for path, _, names in os.walk(detect):
                    os.chown(path, uid, gid)
                    for name in names:
                        os.chown(os.path.join(path, name), uid, gid)
            except OSError as err:
                print(f"WARNING: {detect} stays owned by root ({err}).")


        try:
            from ultralytics import YOLO
            m = YOLO("yolo26n.pt")
            m.export(format="onnx", simplify=True, dynamic=True)
            with open("labels.txt", "w") as f:
                f.writelines(m.names[i] + "\n" for i in range(len(m.names)))
            os.replace("yolo26n.onnx", "model.onnx")
            os.remove("yolo26n.pt")
            print("wrote model.onnx and labels.txt")
        finally:
            hand_back()

volumes:
  video:
  mongo-data:

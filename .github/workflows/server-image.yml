# Builds the Server container and pushes it to GHCR, where deployments pull it from
# (see deploy/docker-compose.yml).
name: server-image

on:
  push:
    branches: [main]
    paths:
      - "Server/Serval.Server/**"
      - "Shared/**"
      - "App/serval_app/**"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
  # Pushing a v<major>.<minor>.<patch> tag is how a release is cut, and the version it names has to
  # get an image of its own even though the commit it points at was probably built already.
  #
  # `create` rather than a tags: entry under push: above — the paths filter applies to every push
  # event, and a tag introduces no files, so a tag push can match nothing and be silently skipped.
  # Path filters are only valid for push and pull_request, so this route cannot be filtered out.
  create:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/serval-server

jobs:
  build:
    # `create` fires for every ref, branches included. Only a version tag should build.
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          # git describe needs the tags and the commits between them. A shallow checkout has
          # neither, and would fail rather than mislead — but failing the build to save a fetch is
          # a poor trade on a job that then spends minutes compiling llama.cpp.
          fetch-depth: 0

      # A release names its own version: the tag is the answer, so `git tag v0.4.2` publishes 0.4.2
      # and nothing else has a say. A build off main is not a release and has no version of its
      # own — it stamps the last release, and SOURCE_REVISION below is what identifies the build.
      #
      # Numeric x.y.z either way, because the Dockerfile hands this to -p:VersionPrefix, which
      # takes major.minor.patch and rejects a prerelease suffix. No tag at all fails this step
      # outright, which is the point — there is no version to guess.
      - id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF#refs/tags/v}
          else
            version=$(git describe --tags --match 'v[0-9]*' --abbrev=0 | sed 's/^v//')
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Building $version" >>"$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token; no PAT needed to push from within this repo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Two streams. A tag push is a release and takes the three tags an unpinned, a
          # minor-pinned and an exactly-pinned deployment follow:
          #   latest      moves to the newest release — what deploy/docker-compose.yml defaults to
          #   0.4         moves within a minor — patches arrive, the shape does not change
          #   0.4.2       one release, never rewritten
          #
          # A push to main is not a release. It gets `edge` and its sha and consumes no version
          # number, so a failed build or a commit the paths filter skips cannot burn one:
          #   edge        moves every push to main — head, for a deployment that wants it
          #   sha-abc1234 one commit; rolling back on the NAS is editing the tag to this
          #
          # latest is gated on the ref being a tag rather than on the branch, so a push to main
          # cannot drag it onto an unreleased build. {{major}}.{{minor}} reads the tag off the ref
          # and so emits nothing on a main build, which is the behaviour wanted here.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # A registry reference has to be lowercase and github.repository_owner is not — it is the
      # account name as spelled, "Flickersoft". metadata-action normalises the image name for the
      # tags it emits above, which is why env.IMAGE can carry it verbatim; cache-from and cache-to
      # are handed to buildx as written and so need the owner folded here. ${VAR,,} is bash, which
      # is the default shell for `run` on the Linux runners.
      - id: cache
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/serval-server-buildcache:main" >>"$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          # Repo root: the Server project references ../../Shared/*.
          context: .
          file: Server/Serval.Server/Dockerfile
          # The Server targets x86_64 hosts. Building arm64 too would roughly double the job for
          # nothing — the arm64 target in this repo is the CameraModule, which is not containerised.
          platforms: linux/amd64
          # Both are stamped into the assembly and into the web App. The commit is what AGPL
          # section 13 turns into a source offer in the UI; the version is what a person quotes in
          # a bug report. Neither can be derived inside the build — .git/ is not in the context.
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SERVAL_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps the .NET restore + apt layers warm between pushes, which is what makes a
          # source-only change a short build.
          # Also what keeps the Edge TPU natives cheap: the TensorFlow clone and CMake build of
          # libtensorflowlite_c.so is ~9 minutes of work that only re-runs when TF_TAG changes, so a
          # source-only edit never pays for it.
          #
          # A registry rather than the Actions cache, for two reasons that both make `type=gha`
          # unable to hold this particular cache:
          #
          #   * Actions caches are scoped by the ref that wrote them, and this workflow builds from
          #     tags as well as main (see the `create` trigger above). A tag run writes under
          #     refs/tags/..., which a later push to main cannot read — so the most expensive builds
          #     produce a cache nothing can use. A registry ref has no such scoping: every run here
          #     reads and writes the same one.
          #   * Actions caches share a 10 GB per-repository budget with ci.yml, whose Flutter SDK
          #     (1.6 GB) and NuGet (~650 MB) entries exist per-ref and are touched on every pull
          #     request. BuildKit's ~3.6 GB of blobs are touched only when an image is built, so
          #     under LRU they are always the first eviction — the cache is not merely cold, it is
          #     structurally unable to stay warm.
          #
          # image-manifest + oci-mediatypes are required: GHCR rejects BuildKit's default cache
          # manifest format. Its own package rather than a tag on serval-server, so the cache blobs
          # do not appear in the tag list a deployment picks an image from.
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max,image-manifest=true,oci-mediatypes=true
          
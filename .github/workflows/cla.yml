# Blocks a pull request until its author has signed CLA.md. Signatures are stored in this
# repository at .github/cla-signatures.json — no third-party service holds them.
#
# The bot comments on a new pull request; the contributor replies with the sign-off phrase below
# and the check goes green. Signing once covers every future pull request from that account.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only act on the sign-off comment itself, or on pull request events — not on every comment.
    if: >
      (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'

    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Flickersoft/Serval/blob/main/CLA.md
          path-to-signatures: .github/cla-signatures.json
          branch: main
          # The repository owner is a party to the agreement, not a signatory to it.
          allowlist: jeremiah-huston,dependabot[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Serval requires a signed Contributor License Agreement
            before a first contribution can be merged — please read
            [CLA.md](https://github.com/Flickersoft/Serval/blob/main/CLA.md), then post the
            following as a comment on this pull request:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
